<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<title>開箱</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="hero">

<h1>📦 開箱</h1>

</div>

<main>

<div class="card" style="text-align:center;">

    <div id="caseContainer">

        <img
            id="caseImage"
            style="width:180px;display:block;margin:auto;">

        <h2 id="caseName"></h2>

        <br>

        <button
            id="openCase"
            class="btn">

            開啟箱子

        </button>

    </div>

    <div
        id="animationContainer"
        style="display:none;">

        <div class="case-pointer">

            ▼

        </div>

        <div id="caseRoll"></div>

    </div>

    <div
        id="rewardContainer"
        style="display:none;">

        <img
            id="rewardImage"
            style="width:180px;display:block;margin:auto;">

        <h2 id="rewardName"></h2>

        <br>

        <button
            id="backShop"
            class="btn">

            返回商店

        </button>

    </div>

</div>

</div>

</main>

<script src="js/items-data.js"></script>
<script src="js/cases-data.js"></script>
<script src="js/case.js"></script>

</body>

</html>
