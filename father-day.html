<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>父親節快樂 🎁</title>

<link
rel="stylesheet"
href="css/style.css">

<style>

/* ==========================
   Father's Day
========================== */

body{

    overflow-x:hidden;

}

.father-day{

    min-height:80vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 20px;

}

.father-card{

    width:700px;

    max-width:95%;

    text-align:center;

    padding:50px 30px;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        #241935,
        #17121f
    );

    border:1px solid
    rgba(255,255,255,.1);

    box-shadow:
    0 20px 60px
    rgba(0,0,0,.45);

}

.father-icon{

    font-size:70px;

    margin-bottom:15px;

}

.father-title{

    font-size:42px;

    margin:10px 0;

}

.father-subtitle{

    color:#cfcfcf;

    font-size:18px;

    margin-bottom:35px;

}

.gift-box{

    width:220px;

    height:220px;

    margin:30px auto;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:110px;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        #35204f,
        #21152f
    );

    border:2px solid
    rgba(255,215,0,.35);

    box-shadow:
    0 0 35px
    rgba(255,215,0,.12);

}

.gift-title{

    font-size:24px;

    margin-top:25px;

}

.gift-desc{

    color:#aaa;

    margin:10px 0 25px;

}

.father-button{

    padding:14px 35px;

    font-size:18px;

}

.hidden{

    display:none;

}

</style>

</head>

<body>

<!-- ==========================
     Header
========================== -->

<div class="hero">

    <h1>
        🎁 父親節特別活動
    </h1>

</div>


<!-- ==========================
     Main
========================== -->

<main>

<div class="father-day">

<div class="father-card">

    <div class="father-icon">

        🎉

    </div>

    <h1 class="father-title">

        父親節快樂！

    </h1>

    <p class="father-subtitle">

        今天不是來做任務的。

        <br>

        今天，是你的節日。

    </p>


    <!-- ==========================
         Gift
    ========================== -->

    <div
        id="giftSection">

        <div class="gift-box">

            🎁

        </div>

        <h2 class="gift-title">

            父親節限定禮物

        </h2>

        <p class="gift-desc">

            有一份特別為你準備的禮物。

            <br>

            準備好就打開它吧。

        </p>

        <button
            id="previewBtn"
            class="btn father-button">

            查看禮物 🎁

        </button>

    </div>


    <!-- ==========================
         Preview
    ========================== -->

    <div
        id="previewSection"
        class="hidden">

        <div class="gift-box">

            🎁

        </div>

        <h2>

            父親節限定禮物箱

        </h2>

        <p>

            這份禮物只屬於今天。

        </p>

        <br>

        <p>

            ✨ 可能獲得

        </p>

        <p>

            💰 888 Gold

        </p>

        <p>

            🎁 特別禮物

        </p>

        <p>

            💌 神秘驚喜

        </p>

        <br>

        <button
            id="openGiftBtn"
            class="btn father-button">

            開啟禮物 ✨

        </button>

    </div>


    <!-- ==========================
         Reward
    ========================== -->

    <div
        id="rewardSection"
        class="hidden">

        <div class="gift-box">

            ✨🎁✨

        </div>

        <h1>

            🎉 恭喜！

        </h1>

        <h2>

            你獲得了父親節限定禮物！

        </h2>

        <p>

            💰 888 Gold

        </p>

        <br>

        <p>

            謝謝你一直以來的陪伴。

        </p>

    </div>

</div>

</div>

</main>


<script>

const previewBtn =
    document.getElementById(
        "previewBtn"
    );

const openGiftBtn =
    document.getElementById(
        "openGiftBtn"
    );

const giftSection =
    document.getElementById(
        "giftSection"
    );

const previewSection =
    document.getElementById(
        "previewSection"
    );

const rewardSection =
    document.getElementById(
        "rewardSection"
    );


/* ==========================
   查看禮物
========================== */

previewBtn.addEventListener(
    "click",
    () => {

        giftSection
        .classList
        .add("hidden");

        previewSection
        .classList
        .remove("hidden");

    }
);


/* ==========================
   開啟禮物
========================== */

openGiftBtn.addEventListener(
    "click",
    () => {

        previewSection
        .classList
        .add("hidden");

        rewardSection
        .classList
        .remove("hidden");

    }
);

</script>

</body>

</html>
